# rustfmt -- strictest stable settings. Only options that are stable on the
# pinned toolchain (rust-toolchain.toml) are set, so `make fmt` needs no nightly.
edition = "2024"
max_width = 120
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Max"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
merge_derives = true
use_try_shorthand = true
use_field_init_shorthand = true
force_explicit_abi = true
match_block_trailing_comma = true
